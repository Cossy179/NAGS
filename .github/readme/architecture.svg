<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="395" viewBox="0 0 1200 395" role="img" aria-labelledby="at ad">
<title id="at">NAGS architecture</title><desc id="ad">The UCI interface drives a C++ alpha-beta engine backed by NNUE, a transposition table, and Syzygy. Optional GNN and MCTS execute separately with alpha-beta move verification. A meta-learner can tune search parameters.</desc>
