<text x="35" y="42" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="2.2" fill="#C9F285">01 / THE ENGINE</text>
<text x="35" y="68" font-size="15" font-family="Arial,Helvetica,sans-serif" fill="#A8B8B5">The C++ search core is the production-strength foundation. Neural search is an optional experimental arm.</text>
