name: nags-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Build the engines (used by the self-play and NNUE tests)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DNAGS_BUILD_TESTS=OFF
          cmake --build build --parallel --target nags nags_enhanced rpc_client
      - name: Unit tests
        run: python -m pytest -q
      - name: RPC round trip (rpc_server.py + rpc_client)
        run: |
          python rpc_server.py --port 5555 --hidden-dim 32 &
          ./build/rpc_client 127.0.0.1 5555
          kill %1
